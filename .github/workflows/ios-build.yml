name: Build MD3 iOS Showcase

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    name: Analyze, Test & Build iOS (.ipa + Simulator)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter & Xcode versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Generate iOS runner template if missing
        run: |
          if [ ! -d "ios/Runner.xcodeproj" ]; then
            echo "Generating iOS runner via flutter create..."
            rm -rf /tmp/ios_scaffold
            flutter create --platforms=ios --org dev.md3 --project-name md3_ios_showcase /tmp/ios_scaffold
            cp -R /tmp/ios_scaffold/ios ./ios
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MD3 Showcase" ios/Runner/Info.plist 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string MD3 Showcase" ios/Runner/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleName MD3 Showcase" ios/Runner/Info.plist 2>/dev/null || true
          fi

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test

      - name: Build unsigned iOS release (.app -> .ipa)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -r -y ../MD3-iOS-Showcase-unsigned.ipa Payload
          ls -lh ../MD3-iOS-Showcase-unsigned.ipa

      - name: Build iOS Simulator app (.app.zip)
        run: |
          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -r -y ../../MD3-iOS-Showcase-simulator.app.zip Runner.app
          ls -lh ../../MD3-iOS-Showcase-simulator.app.zip

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MD3-iOS-Showcase-unsigned-ipa
          path: build/MD3-iOS-Showcase-unsigned.ipa
          retention-days: 30

      - name: Upload iOS Simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MD3-iOS-Showcase-simulator-app
          path: build/MD3-iOS-Showcase-simulator.app.zip
          retention-days: 30

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MD3-iOS-Showcase-unsigned.ipa
            build/MD3-iOS-Showcase-simulator.app.zip
